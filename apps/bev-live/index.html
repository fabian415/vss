<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEV Live</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #2a313c; --text: #e6edf3; --muted: #8b949e;
    --accent: #76b900; --warn: #d29922; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px;
    color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chip b { color: var(--text); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--bad); margin-right: 6px; vertical-align: 1px; }
  .dot.ok { background: var(--accent); } .dot.stale { background: var(--warn); }
  .controls { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-left: auto; }
  .controls label { display: flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
  input[type=range] { width: 120px; accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); }
  button { background: transparent; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 12px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--muted); }
  button.on { border-color: var(--warn); color: var(--warn); }
  main { flex: 1; min-height: 0; display: grid; gap: 12px; padding: 12px;
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .panel-title { padding: 8px 12px; color: var(--muted); font-size: 12px;
    border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  #bevWrap { position: relative; flex: 1; min-height: 0; }
  #bev { position: absolute; inset: 0; width: 100%; height: 100%; }
  #tip { position: absolute; pointer-events: none; background: rgba(13,17,23,.92);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px;
    display: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #cams { flex: 1; min-height: 0; display: grid; gap: 8px; padding: 8px;
    grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); }
  .cam { position: relative; background: #000; border-radius: 6px; overflow: hidden;
    border: 2px solid transparent; cursor: zoom-in; min-height: 0; }
  .cam:hover { border-color: var(--accent); }
  .cam img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .cam .label { position: absolute; left: 8px; top: 6px; background: rgba(0,0,0,.65);
    padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  #cams.focus { grid-template-columns: 1fr; }
  #cams.focus .cam { display: none; }
  #cams.focus .cam.big { display: block; cursor: zoom-out; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(320px, 55vh) auto; }
    #cams { grid-auto-rows: 28vw; }
  }
</style>
</head>
<body>
<header>
  <h1><span>●</span> BEV Live · 多攝影機融合軌跡</h1>
  <div class="stats">
    <span class="chip"><span id="conn" class="dot"></span><b id="connTxt">連線中</b></span>
    <span class="chip">BEV <b id="fps">0</b> fps</span>
    <span class="chip">● 人 <b id="cPerson">0</b></span>
    <span class="chip">◆ 機器人 <b id="cRobot">0</b></span>
    <span class="chip">■ 推車 <b id="cCart">0</b></span>
    <span class="chip">延遲 <b id="lat">–</b></span>
    <span class="chip"><b id="clock">–</b></span>
  </div>
  <div class="controls">
    <label>軌跡長度 <input id="trail" type="range" min="5" max="120" value="20"> <b id="trailVal">20</b>s</label>
    <label><input id="showIds" type="checkbox" checked> ID</label>
    <label><input id="showCams" type="checkbox" checked> 攝影機位置</label>
    <button id="pause">暫停</button>
    <button id="clear">清除軌跡</button>
  </div>
</header>
<main>
  <section class="panel">
    <div class="panel-title"><span>Bird-Eye View（mdx-bev）</span><span>滑過軌跡頭可看座標</span></div>
    <div id="bevWrap"><canvas id="bev"></canvas><div id="tip"></div></div>
  </section>
  <section class="panel">
    <div class="panel-title"><span>攝影機畫面（VST live）</span><span>點一下放大</span></div>
    <div id="cams"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const canvas = $("bev"), ctx = canvas.getContext("2d"), tip = $("tip");
const mapImg = new Image(); mapImg.src = "/map.png";
let cfg = null, view = { s: 1, ox: 0, oy: 0 };
const tracks = new Map();          // id -> {pts:[[t,x,y]], last:t}
let latestT = 0, paused = false, hoverCam = null, hoverId = null;
let frameCount = 0, lastMsgAt = 0;

const color = id => `hsl(${(parseInt(id, 10) * 137.508) % 360} 85% 60%)`;
// 類別 → 分組（計數）與標記形狀
const groupOf = t => t === "Person" ? "person" : t === "Transporter" ? "cart" : /Humanoid|Carter/.test(t) ? "robot" : "other";
const TYPE_ZH = { Person: "人", Transporter: "推車", Agility_Digit_Humanoid: "人形機器人 Digit",
  Fourier_GR1_T2_Humanoid: "人形機器人 GR1", Nova_Carter: "AMR Nova Carter", Forklift: "堆高機" };
function marker(g, px, py, r) {
  ctx.beginPath();
  if (g === "cart") ctx.rect(px - r, py - r, 2 * r, 2 * r);
  else if (g === "robot") { ctx.moveTo(px, py - r * 1.3); ctx.lineTo(px + r * 1.1, py); ctx.lineTo(px, py + r * 1.3); ctx.lineTo(px - r * 1.1, py); ctx.closePath(); }
  else ctx.arc(px, py, r, 0, Math.PI * 2);
}
const toPx = (x, y) => {          // world -> map px -> canvas px
  const T = cfg.T, w = T[2][0] * x + T[2][1] * y + T[2][2];
  const mx = (T[0][0] * x + T[0][1] * y + T[0][2]) / w;
  const my = (T[1][0] * x + T[1][1] * y + T[1][2]) / w;
  return [view.ox + mx * view.s, view.oy + my * view.s];
};

function resize() {
  const r = canvas.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  canvas.width = r.width * dpr; canvas.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (cfg) {
    view.s = Math.min(r.width / cfg.map.w, r.height / cfg.map.h);
    view.ox = (r.width - cfg.map.w * view.s) / 2;
    view.oy = (r.height - cfg.map.h * view.s) / 2;
  }
}
new ResizeObserver(resize).observe($("bevWrap"));

function onFrame(f) {
  if (paused) return;
  frameCount++; lastMsgAt = performance.now();
  latestT = Math.max(latestT, f.t);
  for (const [id, x, y, type] of f.o) {
    let tr = tracks.get(id);
    if (!tr) tracks.set(id, tr = { pts: [], last: 0, type: "" });
    tr.pts.push([f.t, x, y]); tr.last = f.t; tr.type = type || tr.type;
  }
}

function draw() {
  requestAnimationFrame(draw);
  if (!cfg) return;
  const r = canvas.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  if (mapImg.complete) ctx.drawImage(mapImg, view.ox, view.oy, cfg.map.w * view.s, cfg.map.h * view.s);

  const trailMs = $("trail").value * 1000, cutoff = latestT - trailMs;
  const counts = { person: 0, robot: 0, cart: 0, other: 0 };
  const heads = [];
  for (const [id, tr] of tracks) {
    while (tr.pts.length && tr.pts[0][0] < cutoff) tr.pts.shift();
    if (!tr.pts.length) { tracks.delete(id); continue; }
    const c = color(id), live = latestT - tr.last < 1000, hl = hoverId === id;
    ctx.lineWidth = hl ? 4 : 2.5; ctx.lineJoin = ctx.lineCap = "round";
    for (let i = 1; i < tr.pts.length; i++) {      // 舊→新 漸亮
      const [t0, x0, y0] = tr.pts[i - 1], [, x1, y1] = tr.pts[i];
      ctx.globalAlpha = 0.15 + 0.85 * (t0 - cutoff) / trailMs;
      ctx.strokeStyle = c; ctx.beginPath();
      ctx.moveTo(...toPx(x0, y0)); ctx.lineTo(...toPx(x1, y1)); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if (live) {
      const g = groupOf(tr.type);
      counts[g]++;
      const [, x, y] = tr.pts[tr.pts.length - 1], [px, py] = toPx(x, y);
      heads.push({ id, px, py, x, y, type: tr.type });
      ctx.fillStyle = c; ctx.strokeStyle = "#0e1116"; ctx.lineWidth = 2;
      marker(g, px, py, hl ? 8 : 6); ctx.fill(); ctx.stroke();
      if ($("showIds").checked) {
        ctx.font = "600 12px system-ui"; ctx.lineWidth = 3; ctx.strokeStyle = "#0e1116";
        ctx.strokeText(id, px + 9, py - 8); ctx.fillStyle = c; ctx.fillText(id, px + 9, py - 8);
      }
    }
  }
  draw.heads = heads;

  if ($("showCams").checked) for (const cam of cfg.cameras) {
    if (cam.x == null) continue;
    const [px, py] = toPx(cam.x, cam.y), hl = hoverCam === cam.name;
    ctx.fillStyle = hl ? "#76b900" : "rgba(255,255,255,.9)"; ctx.strokeStyle = "#0e1116"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(px - 7, py - 5, 14, 10, 2); ctx.fill(); ctx.stroke();
    if (hl) { ctx.strokeStyle = "#76b900"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, py, 16 + 4 * Math.sin(performance.now() / 150), 0, Math.PI * 2); ctx.stroke(); }
    ctx.font = "600 11px system-ui"; ctx.lineWidth = 3; ctx.strokeStyle = "#0e1116";
    ctx.strokeText(cam.name, px + 10, py + 4); ctx.fillStyle = hl ? "#76b900" : "#fff"; ctx.fillText(cam.name, px + 10, py + 4);
  }
  $("cPerson").textContent = counts.person;
  $("cRobot").textContent = counts.robot;
  $("cCart").textContent = counts.cart;
}

canvas.addEventListener("mousemove", e => {
  const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  let best = null, bd = 18 * 18;
  for (const h of draw.heads || []) { const d = (h.px - mx) ** 2 + (h.py - my) ** 2; if (d < bd) { bd = d; best = h; } }
  hoverId = best ? best.id : null;
  if (best) {
    tip.style.display = "block"; tip.style.left = best.px + 14 + "px"; tip.style.top = best.py + 10 + "px";
    tip.innerHTML = `${TYPE_ZH[best.type] || best.type || "?"} · ID <b style="color:${color(best.id)}">${best.id}</b> · x ${best.x.toFixed(2)} m · y ${best.y.toFixed(2)} m`;
  } else tip.style.display = "none";
});
canvas.addEventListener("mouseleave", () => { hoverId = null; tip.style.display = "none"; });

$("trail").oninput = e => $("trailVal").textContent = e.target.value;
$("pause").onclick = e => { paused = !paused; e.target.textContent = paused ? "繼續" : "暫停"; e.target.classList.toggle("on", paused); };
$("clear").onclick = () => tracks.clear();

setInterval(() => {
  $("fps").textContent = frameCount; frameCount = 0;
  const age = performance.now() - lastMsgAt, dot = $("conn");
  dot.className = "dot" + (age < 2000 ? " ok" : age < 10000 ? " stale" : "");
  $("connTxt").textContent = paused ? "已暫停" : age < 2000 ? "即時" : age < 10000 ? "資料延遲" : "無資料";
  if (latestT) {
    $("lat").textContent = Math.max(0, Date.now() - latestT) + " ms";
    $("clock").textContent = new Date(latestT).toLocaleTimeString("zh-TW", { hour12: false });
  }
}, 1000);

fetch("/config.json").then(r => r.json()).then(c => {
  cfg = c; resize();
  const box = $("cams");
  for (const cam of c.cameras) {
    const el = document.createElement("div");
    el.className = "cam";
    el.innerHTML = `<img src="/cam/${encodeURIComponent(cam.name)}" alt="${cam.name}"><span class="label">${cam.name}</span>`;
    el.onmouseenter = () => hoverCam = cam.name;
    el.onmouseleave = () => hoverCam = null;
    el.onclick = () => {
      const big = !el.classList.contains("big");
      box.querySelectorAll(".cam").forEach(x => x.classList.remove("big"));
      el.classList.toggle("big", big); box.classList.toggle("focus", big);
    };
    box.appendChild(el);
  }
  const es = new EventSource("/events");
  es.onmessage = e => onFrame(JSON.parse(e.data));
  requestAnimationFrame(draw);
});
</script>
</body>
</html>
