<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEV Live</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #2a313c; --text: #e6edf3; --muted: #8b949e;
    --accent: #76b900; --warn: #d29922; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px;
    color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chip b { color: var(--text); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--bad); margin-right: 6px; vertical-align: 1px; }
  .dot.ok { background: var(--accent); } .dot.stale { background: var(--warn); }
  .controls { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-left: auto; }
  .controls label { display: flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
  input[type=range] { width: 120px; accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); }
  button { background: transparent; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 12px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--muted); }
  button.on { border-color: var(--warn); color: var(--warn); }
  main { flex: 1; min-height: 0; display: grid; gap: 12px; padding: 12px;
    grid-template-columns: minmax(0, 1.8fr) minmax(0, 1fr); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .panel-title { padding: 8px 12px; color: var(--muted); font-size: 12px;
    border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  #bevWrap { position: relative; flex: 1; min-height: 0; }
  #bev { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  #bev.drag { cursor: grabbing; }
  .view3d { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  .labels3d { pointer-events: none; }
  #bevWrap.is3d #bev { display: none; }
  #bevWrap.is3d .view3d { display: block; }
  .lbl { font: 600 12px system-ui; text-shadow: 0 0 3px #0e1116, 0 0 3px #0e1116, 0 0 3px #0e1116; }
  .lbl.cam3d { color: #fff; font-size: 11px; } .lbl.cam3d.hl { color: var(--accent); }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 6px; font: inherit; }
  #tip { position: absolute; z-index: 2; pointer-events: none; background: rgba(13,17,23,.92);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px;
    display: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #cams { flex: 1; min-height: 0; display: grid; gap: 8px; padding: 8px;
    grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); }
  .cam { position: relative; background: #000; border-radius: 6px; overflow: hidden;
    border: 2px solid transparent; cursor: zoom-in; min-height: 0; }
  .cam:hover { border-color: var(--accent); }
  .cam img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .cam .label { position: absolute; left: 8px; top: 6px; background: rgba(0,0,0,.65);
    padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  #cams.focus { grid-template-columns: 1fr; }
  #cams.focus .cam { display: none; }
  #cams.focus .cam.big { display: block; cursor: zoom-out; }
  /* 碰撞通知：右上角，5 秒後淡出（與 HIGHLIGHT_MS 一致） */
  #toasts { position: fixed; top: 64px; right: 16px; z-index: 50; display: flex; flex-direction: column;
    gap: 8px; width: min(360px, calc(100vw - 32px)); pointer-events: none; }
  .toast { background: #2a1214; border: 1px solid var(--bad); border-left: 4px solid var(--bad);
    border-radius: 8px; padding: 10px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.45);
    animation: toastIn .18s ease-out, toastOut .4s ease-in 4.6s forwards; }
  .toast .t-title { color: var(--bad); font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
  .toast .t-title span { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  .toast .t-body { margin-top: 4px; }
  .toast .t-body b { font-weight: 600; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
  @keyframes toastOut { to { opacity: 0; transform: translateX(16px); } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: toastOut .01s linear 4.99s forwards; } }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(320px, 55vh) auto; }
    #cams { grid-auto-rows: 28vw; }
  }
</style>
</head>
<body>
<header>
  <h1><span>●</span> BEV Live · 多攝影機融合軌跡</h1>
  <div class="stats">
    <span class="chip"><span id="conn" class="dot"></span><b id="connTxt">連線中</b></span>
    <span class="chip">BEV <b id="fps">0</b> fps</span>
    <span class="chip">● 人 <b id="cPerson">0</b></span>
    <span class="chip">◆ 機器人 <b id="cRobot">0</b></span>
    <span class="chip">■ 推車 <b id="cCart">0</b></span>
    <span class="chip">延遲 <b id="lat">–</b></span>
    <span class="chip"><b id="clock">–</b></span>
  </div>
  <div class="controls">
    <label>軌跡長度 <input id="trail" type="range" min="5" max="120" value="20"> <b id="trailVal">20</b>s</label>
    <label><input id="showIds" type="checkbox" checked> ID</label>
    <label><input id="showCams" type="checkbox" checked> 攝影機位置</label>
    <button id="mode3d" title="切換 2D 平面 / 3D 立體">3D 視圖</button>
    <select id="viewSel" hidden title="3D 視角"><option value="">自由視角</option></select>
    <button id="pause">暫停</button>
    <button id="clear">清除軌跡</button>
  </div>
</header>
<div id="toasts" role="status" aria-live="polite"></div>
<main>
  <section class="panel">
    <div class="panel-title"><span>Bird-Eye View（mdx-bev）</span><span id="hint">滾輪縮放 · 拖曳平移 · 雙擊重置 · 滑過軌跡頭可看座標</span></div>
    <div id="bevWrap"><canvas id="bev"></canvas><div id="tip"></div></div>
  </section>
  <section class="panel">
    <div class="panel-title"><span>攝影機畫面（VST live）</span><span>點一下放大</span></div>
    <div id="cams"></div>
  </section>
</main>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script>
const $ = id => document.getElementById(id);
const canvas = $("bev"), ctx = canvas.getContext("2d"), tip = $("tip");
const mapImg = new Image(); mapImg.src = "/map.png";
let cfg = null, view = { s: 1, ox: 0, oy: 0 };
let crop = null, zoom = 1, pan = [0, 0];   // crop: 地圖實際內容範圍（去掉兩側灰邊）
mapImg.onload = () => {
  const w = mapImg.naturalWidth, h = mapImg.naturalHeight, c = document.createElement("canvas");
  c.width = w; c.height = h; const g = c.getContext("2d"); g.drawImage(mapImg, 0, 0);
  const d = g.getImageData(0, 0, w, h).data, bg = [d[0], d[1], d[2]];
  const isBg = i => Math.abs(d[i] - bg[0]) + Math.abs(d[i + 1] - bg[1]) + Math.abs(d[i + 2] - bg[2]) < 12;
  const colBg = x => { for (let y = 0; y < h; y += 4) if (!isBg((y * w + x) * 4)) return false; return true; };
  const rowBg = y => { for (let x = 0; x < w; x += 4) if (!isBg((y * w + x) * 4)) return false; return true; };
  let x0 = 0, x1 = w - 1, y0 = 0, y1 = h - 1;
  while (x0 < x1 && colBg(x0)) x0++; while (x1 > x0 && colBg(x1)) x1--;
  while (y0 < y1 && rowBg(y0)) y0++; while (y1 > y0 && rowBg(y1)) y1--;
  crop = { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 }; resize();
};
const tracks = new Map();          // id -> {pts:[[t,x,y]], last:t}
let latestT = 0, paused = false, hoverCam = null, hoverId = null;
let frameCount = 0, lastMsgAt = 0;
const HIGHLIGHT_MS = 5000;
const alerts = [];                 // 碰撞高亮：{ids, primary, until}

// 顏色：新軌跡出現時，挑一個跟畫面上現有軌跡色相差最遠的；避開紅色（碰撞警告專用）。
// 同一個 ID 之後再出現時沿用原本的顏色。
const colorCache = new Map();      // id -> {h, css}
const hueDist = (a, b) => { const d = Math.abs(a - b) % 360; return Math.min(d, 360 - d); };
function color(id) {
  let c = colorCache.get(id);
  if (c) return c.css;
  if (colorCache.size > 500) for (const k of colorCache.keys()) if (!tracks.has(k)) colorCache.delete(k);
  const used = [...tracks.keys()].filter(k => k !== id && colorCache.has(k)).map(k => colorCache.get(k).h);
  let best = 0, bestD = -1;
  for (let i = 0; i < 24; i++) {
    const h = 25 + Math.random() * 310;            // 25°～335°，不含紅色
    const d = used.length ? Math.min(...used.map(u => hueDist(h, u))) : Math.random();
    if (d > bestD) { bestD = d; best = h; }
  }
  const l = [58, 66, 52][colorCache.size % 3];     // 亮度輪替，色相接近時也分得出來
  c = { h: best, css: `hsl(${best.toFixed(0)} 85% ${l}%)` };
  colorCache.set(id, c);
  return c.css;
}
// 類別 → 分組（計數）與標記形狀
const groupOf = t => t === "Person" ? "person" : t === "Transporter" ? "cart" : /Humanoid|Carter/.test(t) ? "robot" : "other";
const TYPE_ZH = { Person: "人", Transporter: "推車", Agility_Digit_Humanoid: "人形機器人 Digit",
  Fourier_GR1_T2_Humanoid: "人形機器人 GR1", Nova_Carter: "AMR Nova Carter", Forklift: "堆高機" };
function marker(g, px, py, r) {
  ctx.beginPath();
  if (g === "cart") ctx.rect(px - r, py - r, 2 * r, 2 * r);
  else if (g === "robot") { ctx.moveTo(px, py - r * 1.3); ctx.lineTo(px + r * 1.1, py); ctx.lineTo(px, py + r * 1.3); ctx.lineTo(px - r * 1.1, py); ctx.closePath(); }
  else ctx.arc(px, py, r, 0, Math.PI * 2);
}
const toPx = (x, y) => {          // world -> map px -> canvas px
  const T = cfg.T, w = T[2][0] * x + T[2][1] * y + T[2][2];
  const mx = (T[0][0] * x + T[0][1] * y + T[0][2]) / w;
  const my = (T[1][0] * x + T[1][1] * y + T[1][2]) / w;
  return [view.ox + mx * view.s, view.oy + my * view.s];
};

function resize() {
  const r = canvas.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if (!r.width || !r.height) return;   // 3D 模式時 2D 畫布被隱藏，量到 0 會把畫面縮成 0
  canvas.width = r.width * dpr; canvas.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (cfg) {
    const c = crop || { x: 0, y: 0, w: cfg.map.w, h: cfg.map.h };
    view.s = Math.min(r.width / c.w, r.height / c.h) * zoom;
    view.ox = (r.width - c.w * view.s) / 2 - c.x * view.s + pan[0];
    view.oy = (r.height - c.h * view.s) / 2 - c.y * view.s + pan[1];
  }
}
new ResizeObserver(resize).observe($("bevWrap"));

function onFrame(f) {
  if (paused) return;
  frameCount++; lastMsgAt = performance.now();
  latestT = Math.max(latestT, f.t);
  for (const [id, x, y, type, ...dim] of f.o) {
    let tr = tracks.get(id);
    if (!tr) tracks.set(id, tr = { pts: [], last: 0, type: "" });
    tr.pts.push([f.t, x, y]); tr.last = f.t; tr.type = type || tr.type;
    if (dim.length >= 4) tr.dim = dim;            // [w, l, h, yaw]（3D 視圖用）
  }
}

function draw() {
  requestAnimationFrame(draw);
  if (!cfg) return;
  const r = canvas.getBoundingClientRect(), is3d = !!view3d;
  ctx.clearRect(0, 0, r.width, r.height);
  if (!is3d && mapImg.complete) ctx.drawImage(mapImg, view.ox, view.oy, cfg.map.w * view.s, cfg.map.h * view.s);  // 整張畫，crop 只影響置中與比例

  const trailMs = $("trail").value * 1000, cutoff = latestT - trailMs;
  const counts = { person: 0, robot: 0, cart: 0, other: 0 };
  const heads = [];
  for (const [id, tr] of tracks) {
    while (tr.pts.length && tr.pts[0][0] < cutoff) tr.pts.shift();
    if (!tr.pts.length) { tracks.delete(id); continue; }
    const c = color(id), live = latestT - tr.last < 1000, hl = hoverId === id;
    ctx.lineWidth = hl ? 4 : 2.5; ctx.lineJoin = ctx.lineCap = "round";
    for (let i = 1; !is3d && i < tr.pts.length; i++) {      // 舊→新 漸亮
      const [t0, x0, y0] = tr.pts[i - 1], [, x1, y1] = tr.pts[i];
      ctx.globalAlpha = 0.15 + 0.85 * (t0 - cutoff) / trailMs;
      ctx.strokeStyle = c; ctx.beginPath();
      ctx.moveTo(...toPx(x0, y0)); ctx.lineTo(...toPx(x1, y1)); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if (live) {
      const g = groupOf(tr.type);
      counts[g]++;
      const [, x, y] = tr.pts[tr.pts.length - 1], [px, py] = toPx(x, y);
      heads.push({ id, px, py, x, y, type: tr.type });
      if (is3d) continue;
      ctx.fillStyle = c; ctx.strokeStyle = "#0e1116"; ctx.lineWidth = 2;
      marker(g, px, py, hl ? 8 : 6); ctx.fill(); ctx.stroke();
      if ($("showIds").checked) {
        ctx.font = "600 12px system-ui"; ctx.lineWidth = 3; ctx.strokeStyle = "#0e1116";
        ctx.strokeText(id, px + 9, py - 8); ctx.fillStyle = c; ctx.fillText(id, px + 9, py - 8);
      }
    }
  }
  if (is3d) {
    for (let i = alerts.length - 1; i >= 0; i--) if (alerts[i].until < performance.now()) alerts.splice(i, 1);
    draw.heads = view3d.render({ tracks, heads, cutoff, trailMs, alerts, hoverId, hoverCam,
      showIds: $("showIds").checked, showCams: $("showCams").checked });
  } else {
    draw.heads = heads;
    drawAlerts(heads);
  }

  if (!is3d && $("showCams").checked) for (const cam of cfg.cameras) {
    if (cam.x == null) continue;
    const [px, py] = toPx(cam.x, cam.y), hl = hoverCam === cam.name;
    ctx.fillStyle = hl ? "#76b900" : "rgba(255,255,255,.9)"; ctx.strokeStyle = "#0e1116"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(px - 7, py - 5, 14, 10, 2); ctx.fill(); ctx.stroke();
    if (hl) { ctx.strokeStyle = "#76b900"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, py, 16 + 4 * Math.sin(performance.now() / 150), 0, Math.PI * 2); ctx.stroke(); }
    ctx.font = "600 11px system-ui"; ctx.lineWidth = 3; ctx.strokeStyle = "#0e1116";
    ctx.strokeText(cam.name, px + 10, py + 4); ctx.fillStyle = hl ? "#76b900" : "#fff"; ctx.fillText(cam.name, px + 10, py + 4);
  }
  $("cPerson").textContent = counts.person;
  $("cRobot").textContent = counts.robot;
  $("cCart").textContent = counts.cart;
}

// 碰撞高亮：當事的機器人與人加紅色閃爍圈，並以虛線連到主要物件（機器人），5 秒後消失
function drawAlerts(heads) {
  const now = performance.now();
  for (let i = alerts.length - 1; i >= 0; i--) if (alerts[i].until < now) alerts.splice(i, 1);
  if (!alerts.length) return;
  const pos = new Map(heads.map(h => [h.id, h]));
  const pulse = 0.5 + 0.5 * Math.sin(now / 120);
  for (const a of alerts) {
    const p0 = pos.get(a.primary);
    ctx.save();
    ctx.strokeStyle = "#f85149"; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
    if (p0) for (const id of a.ids) {
      const p = pos.get(id);
      if (!p || id === a.primary) continue;
      ctx.beginPath(); ctx.moveTo(p0.px, p0.py); ctx.lineTo(p.px, p.py); ctx.stroke();
    }
    ctx.setLineDash([]);
    for (const id of a.ids) {
      const p = pos.get(id);
      if (!p) continue;
      ctx.globalAlpha = 0.25 + 0.35 * pulse; ctx.fillStyle = "#f85149";
      ctx.beginPath(); ctx.arc(p.px, p.py, 14 + 4 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.px, p.py, 14 + 4 * pulse, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }
}

const nameOf = (id, type) => `${TYPE_ZH[type] || type || "物件"} #${id}`;
function onIncident(inc) {
  if (paused || !inc.ids || !inc.ids.length) return;
  const [primary, ...others] = inc.ids;
  alerts.push({ ids: inc.ids, primary, until: performance.now() + HIGHLIGHT_MS });
  const typeOf = id => inc.types?.[id] || tracks.get(id)?.type || "";
  const el = document.createElement("div");
  el.className = "toast";
  const time = new Date(inc.start).toLocaleTimeString("zh-TW", { hour12: false });
  el.innerHTML = `<div class="t-title">⚠ 碰撞警告<span>${time}</span></div>
    <div class="t-body"><b>${nameOf(primary, typeOf(primary))}</b> 與
    <b>${others.map(id => nameOf(id, typeOf(id))).join("、") || "?"}</b> 距離過近</div>`;
  $("toasts").prepend(el);
  setTimeout(() => el.remove(), HIGHLIGHT_MS);
}

$("bevWrap").addEventListener("mousemove", e => {
  const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  let best = null, bd = 18 * 18;
  for (const h of draw.heads || []) { const d = (h.px - mx) ** 2 + (h.py - my) ** 2; if (d < bd) { bd = d; best = h; } }
  hoverId = best ? best.id : null;
  if (best) {
    tip.style.display = "block"; tip.style.left = best.px + 14 + "px"; tip.style.top = best.py + 10 + "px";
    tip.innerHTML = `${TYPE_ZH[best.type] || best.type || "?"} · ID <b style="color:${color(best.id)}">${best.id}</b> · x ${best.x.toFixed(2)} m · y ${best.y.toFixed(2)} m`;
  } else tip.style.display = "none";
});
$("bevWrap").addEventListener("mouseleave", () => { hoverId = null; tip.style.display = "none"; });
// 縮放／平移：以游標為中心縮放，拖曳平移，雙擊重置
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const nz = Math.min(8, Math.max(1, zoom * Math.exp(-e.deltaY * 0.0015))), k = nz / zoom;
  // 讓游標下的點保持不動：新 offset = m - (m - o) * k，再換算回 pan
  const cx = r.width / 2, cy = r.height / 2;
  pan = [(mx - cx) - ((mx - cx) - pan[0]) * k, (my - cy) - ((my - cy) - pan[1]) * k];
  zoom = nz; if (zoom === 1) pan = [0, 0]; resize();
}, { passive: false });
let dragFrom = null;
canvas.addEventListener("pointerdown", e => { dragFrom = [e.clientX - pan[0], e.clientY - pan[1]]; canvas.setPointerCapture(e.pointerId); canvas.classList.add("drag"); });
canvas.addEventListener("pointermove", e => { if (dragFrom) { pan = [e.clientX - dragFrom[0], e.clientY - dragFrom[1]]; resize(); } });
canvas.addEventListener("pointerup", () => { dragFrom = null; canvas.classList.remove("drag"); });
canvas.addEventListener("dblclick", () => { zoom = 1; pan = [0, 0]; resize(); });

// 3D 視圖：第一次切換時才載入 three.js 與 bev3d.js
let view3d = null, view3dObj = null;
const HINT2D = $("hint").textContent, HINT3D = "左鍵拖曳旋轉 · 右鍵拖曳平移 · 滾輪縮放 · 雙擊重置 · 視角可切到各攝影機";
async function set3d(on) {
  const btn = $("mode3d");
  if (on && !view3dObj) {
    btn.disabled = true; btn.textContent = "載入中…";
    try {
      const m = await import("/bev3d.js");
      view3dObj = m.create($("bevWrap"), { cfg, crop, mapUrl: "/map.png", colorOf: color, groupOf });
      for (const n of view3dObj.cameras) $("viewSel").add(new Option(`${n} 視角`, n));
    } catch (err) {
      console.error(err);
      onToast("3D 載入失敗", "無法載入 three.js（需能連到 cdn.jsdelivr.net）");
      on = false;
    } finally { btn.disabled = false; }
  }
  view3d = on ? view3dObj : null;
  $("bevWrap").classList.toggle("is3d", on);
  if (!on) resize();                   // 隱藏期間視窗可能變過大小，切回 2D 時重算
  btn.textContent = on ? "2D 視圖" : "3D 視圖"; btn.classList.toggle("on", on);
  $("viewSel").hidden = !on; $("hint").textContent = on ? HINT3D : HINT2D;
  try { localStorage.setItem("bev-mode", on ? "3d" : "2d"); } catch {}
}
function onToast(title, body) {
  const el = document.createElement("div"); el.className = "toast";
  el.innerHTML = `<div class="t-title">${title}</div><div class="t-body">${body}</div>`;
  $("toasts").prepend(el); setTimeout(() => el.remove(), HIGHLIGHT_MS);
}
$("mode3d").onclick = () => set3d(!view3d);
$("viewSel").onchange = e => view3d && view3d.lookFrom(e.target.value);

$("trail").oninput = e => $("trailVal").textContent = e.target.value;
$("pause").onclick = e => { paused = !paused; e.target.textContent = paused ? "繼續" : "暫停"; e.target.classList.toggle("on", paused); };
$("clear").onclick = () => tracks.clear();

setInterval(() => {
  $("fps").textContent = frameCount; frameCount = 0;
  const age = performance.now() - lastMsgAt, dot = $("conn");
  dot.className = "dot" + (age < 2000 ? " ok" : age < 10000 ? " stale" : "");
  $("connTxt").textContent = paused ? "已暫停" : age < 2000 ? "即時" : age < 10000 ? "資料延遲" : "無資料";
  if (latestT) {
    $("lat").textContent = Math.max(0, Date.now() - latestT) + " ms";
    $("clock").textContent = new Date(latestT).toLocaleTimeString("zh-TW", { hour12: false });
  }
}, 1000);

fetch("/config.json").then(r => r.json()).then(c => {
  cfg = c; resize();
  const box = $("cams");
  for (const cam of c.cameras) {
    const el = document.createElement("div");
    el.className = "cam";
    el.innerHTML = `<img src="/cam/${encodeURIComponent(cam.name)}" alt="${cam.name}"><span class="label">${cam.name}</span>`;
    el.onmouseenter = () => hoverCam = cam.name;
    el.onmouseleave = () => hoverCam = null;
    el.onclick = () => {
      const big = !el.classList.contains("big");
      box.querySelectorAll(".cam").forEach(x => x.classList.remove("big"));
      el.classList.toggle("big", big); box.classList.toggle("focus", big);
    };
    box.appendChild(el);
  }
  const es = new EventSource("/events");
  es.onmessage = e => onFrame(JSON.parse(e.data));
  es.addEventListener("incident", e => onIncident(JSON.parse(e.data)));
  requestAnimationFrame(draw);
  let saved = null; try { saved = localStorage.getItem("bev-mode"); } catch {}
  if (saved === "3d") (mapImg.complete ? set3d(true) : mapImg.addEventListener("load", () => set3d(true), { once: true }));
});
</script>
</body>
</html>
